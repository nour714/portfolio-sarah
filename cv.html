                var cores = (nav && typeof nav.hardwareConcurrency === 'number') ? nav.hardwareConcurrency : 8;
                var weak = isSaveData || isSlowNet || (devMem <= 2) || (cores <= 4);
                var lite = override === 'lite' ? true : (override === 'full' ? false : (isTouch && !isIPhone && weak));
                var doc = typeof document !== 'undefined' ? document.documentElement : null;
                if (doc && doc.classList) {
                    if (isTouch) doc.classList.add('is-touch');
                    if (lite) doc.classList.add('perf-lite');
                }
                if (typeof window !== 'undefined') {
                    window.__perf = { isTouch: isTouch, lite: lite };
                }
            } catch (e) {

                }
            }
