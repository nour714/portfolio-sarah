        <!-- Device & Performance Tier Synchronous Detection -->
    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                var override = params.get('perf');
                var mq = function(q) { return Boolean(window.matchMedia && window.matchMedia(q).matches); };
                var isTouch = mq('(hover: none) and (pointer: coarse)');
                var isDesktopClass = mq('(hover: hover) and (pointer: fine)');
                var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                var isSaveData = Boolean(conn && conn.saveData);
                var isSlowNet = Boolean(conn && /^(slow-2g|2g|3g)$/i.test(conn.effectiveType || ''));
                var isReducedMotion = mq('(prefers-reduced-motion: reduce)');
                var devMem = navigator.deviceMemory || 8;
                var cores = navigator.hardwareConcurrency || 8;
                var liteAuto;
                if (!isTouch && isDesktopClass) {
                    liteAuto = isSaveData || isSlowNet || isReducedMotion || (devMem <= 2);
                } else {
                    liteAuto = isSaveData || isSlowNet || isReducedMotion || (devMem <= 4) || (cores <= 4);
                }
                var lite = override === 'lite' ? true : (override === 'full' ? false : liteAuto);
                var doc = document.documentElement;
                if (isTouch) doc.classList.add('is-touch');
                if (lite) doc.classList.add('perf-lite');
                window.__perf = { isTouch: isTouch, lite: lite };
            } catch (e) {
                window.__perf = { isTouch: false, lite: false };
            }
        })();
    </script>
